<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WebDoom — FPS estilo Doom en el navegador, 100% procedural</title>
<meta name="description" content="WebDoom: FPS estilo Doom que corre en el navegador con cero dependencias y cero assets binarios — texturas, sprites, sonido y música 100% procedurales. 3 niveles y un jefe final. Experimento con Qwen3.8-27B."/>
<meta name="color-scheme" content="dark"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<!-- Open Graph / Twitter: cards cuando se comparte la URL (deploy: Cloudflare Pages). -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="WebDoom"/>
<meta property="og:url" content="https://webdoom-blu.pages.dev/"/>
<meta property="og:title" content="WebDoom — FPS estilo Doom 100% procedural en el navegador"/>
<meta property="og:description" content="Cero dependencias, cero assets: motor, niveles, jefe final y audio sintetizado al vuelo. Pruébalo y mata al Warden."/>
<meta property="og:image" content="https://webdoom-blu.pages.dev/og.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="WebDoom — FPS estilo Doom 100% procedural"/>
<meta name="twitter:description" content="Cero dependencias, cero assets: motor, niveles, jefe final y audio sintetizado al vuelo."/>
<meta name="twitter:image" content="https://webdoom-blu.pages.dev/og.png"/>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: crosshair;
  }
  /* on-page error log: visible only when something went wrong (cross-PC debug) */
  #errlog {
    position: absolute; top: 4px; right: 4px; z-index: 10;
    max-width: 60vw; max-height: 40vh; overflow: auto;
    background: rgba(40, 0, 0, 0.92); color: #ff8070;
    border: 1px solid #a03030;
    font: 11px/1.45 ui-monospace, monospace; white-space: pre;
    padding: 6px 8px; display: none;
    pointer-events: none;
  }
  /* full-screen state screens: PAUSED (ESC) and YOU DIED (full HUD in stage 6) */
  #msg {
    position: absolute; inset: 0; z-index: 9;
    display: none; place-items: center;
    background: rgba(0, 0, 0, 0.72);
    color: #ff5040;
    font: bold 30px/1.5 ui-monospace, monospace; letter-spacing: 2px;
    text-align: center; white-space: pre; padding: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<div id="errlog"></div>
<div id="msg"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
