<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WEBDOOM</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: crosshair;
  }
  /* on-page error log: visible only when something went wrong (cross-PC debug) */
  #errlog {
    position: absolute; top: 4px; right: 4px; z-index: 10;
    max-width: 60vw; max-height: 40vh; overflow: auto;
    background: rgba(40, 0, 0, 0.92); color: #ff8070;
    border: 1px solid #a03030;
    font: 11px/1.45 ui-monospace, monospace; white-space: pre;
    padding: 6px 8px; display: none;
    pointer-events: none;
  }
  /* full-screen state screens: PAUSED (ESC) and YOU DIED (full HUD in stage 6) */
  #msg {
    position: absolute; inset: 0; z-index: 9;
    display: none; place-items: center;
    background: rgba(0, 0, 0, 0.72);
    color: #ff5040;
    font: bold 30px/1.5 ui-monospace, monospace; letter-spacing: 2px;
    text-align: center; white-space: pre; padding: 20px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<div id="errlog"></div>
<div id="msg"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
